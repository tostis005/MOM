name: Editorial audit

on:
  push:
    branches: [main]
    paths:
      - 'platform/editorial-audit.py'
      - '.github/workflows/editorial-audit.yml'
      - 'content/articles/**/*.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build editorial audit report
        run: python3 platform/editorial-audit.py
      - name: Commit report
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- editorial-audit-report.json editorial-audit-ranking.tsv editorial-audit-groups.tsv)" ]; then
            echo 'Audit outputs unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-audit-report.json editorial-audit-ranking.tsv editorial-audit-groups.tsv
          git commit -m 'Update editorial audit report'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# Final editorial QA is recalculated after structural recovery and priority deep rewrites.
