name: Editorial recovery

on:
  push:
    branches: [main]
    paths:
      - 'platform/editorial-recover.py'
      - '.github/workflows/editorial-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run editorial recovery
        run: python3 platform/editorial-recover.py
      - name: Commit recovered articles
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- content/articles)" ]; then
            echo 'No article changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles
          git commit -m 'Recover editorial flow across article corpus'
          git push origin HEAD:main
