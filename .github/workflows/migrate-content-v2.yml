name: Migrate MOM content to v2

on:
  push:
    branches:
      - migrate-content-v2
    paths:
      - 'platform/migrate-v1-to-v2.py'
      - 'content/site.json'
      - 'content/taxonomies/*.json'
      - 'content/articles/*/*.json'
      - '.github/workflows/migrate-content-v2.yml'

permissions:
  contents: write

concurrency:
  group: mom-content-v2-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migrate-content-v2

      - name: Migrate legacy article JSON
        run: python3 platform/migrate-v1-to-v2.py .

      - name: Validate v2 content contract
        run: |
          python3 platform/migrate-v1-to-v2.py . --check
          python3 platform/validate-content.py .
          php -l platform/import-content.php
          php -l platform/content-platform.php

      - name: Commit migrated inventory
        run: |
          set -euo pipefail
          if git diff --quiet -- content/articles content/site.json content/taxonomies/topic.json; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles content/site.json content/taxonomies/topic.json
          git commit -m 'Migrate MOM article inventory to Content Contract v2'
          git push origin HEAD:migrate-content-v2
