name: Normalize content v2

on:
  push:
    branches: [main]
    paths:
      - 'content/articles/*/*.json'
      - 'content/site.json'
      - 'content/taxonomies/*.json'
      - 'platform/migrate-v1-to-v2.py'
      - 'platform/normalize-mom-v2.py'
      - 'platform/refine-topic-taxonomy.py'
      - 'platform/validate-content.py'
      - '.github/workflows/normalize-content-v2.yml'

permissions:
  contents: write

concurrency:
  group: mom-normalize-content-v2
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize, refine topic taxonomy and validate
        run: |
          set -euo pipefail
          python3 platform/normalize-mom-v2.py .
          python3 platform/refine-topic-taxonomy.py .
          python3 platform/normalize-mom-v2.py . --check

      - name: Commit normalization when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- content/articles content/site.json content/taxonomies/topic.json; then
            echo 'Content already conforms to v2.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles content/site.json content/taxonomies/topic.json
          git commit -m 'Normalize MOM content to v2'

          # Other maintenance workflows may write to main at nearly the same time.
          # Retry the fetch/rebase/push cycle instead of failing on a harmless race.
          for attempt in 1 2 3 4 5; do
            echo "Normalization push attempt ${attempt}/5"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Normalization committed successfully.'
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'ERROR: could not push normalized content after 5 attempts.' >&2
          exit 1

# Maintenance trigger: editorial recovery validated on the full bilingual corpus.
